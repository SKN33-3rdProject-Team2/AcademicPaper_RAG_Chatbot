# 공통 제공자 연결 정보와 paper_extractor.py의 NVIDIA 설정
providers:
  ollama:
    host: http://localhost:11434
    connection_timeout: 3

# tools/keyword_tool.py
keyword:
  provider: ollama
  model: qwen2.5:3b
  temperature: 0.2
  max_tokens: 160
  timeout: 25

# services/translation_service.py, tools/translation_tool.py
# 번역은 NVIDIA Build API 로 보낸다. 같은 4,000자 조각을 로컬 CPU(translategemma:4b)
# 는 331.9초, 이쪽은 21.8초에 옮겼다(15배). 번역은 입력만큼 긴 출력을 만들어야 해서
# GPU 없는 장비에서는 논문 한 편에 20~50분이 걸린다.
# provider 를 ollama 로 되돌리고 model 을 translategemma:4b 로 바꾸면 예전대로 돈다.
translation:
  provider: nvidia
  model: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
  stream: true
  temperature: 0.2
  max_tokens: 8192
  timeout: 600
  chunk_chars: 4000
  max_retries: 2
  retry_backoff_seconds: 2.0
  output_directory: data/translations

# tools/summary_tool.py, services/summary_markdown_store.py
summary:
  provider: ollama
  model: gemma3:4b
  temperature: 0.0
  max_tokens: 4096
  timeout: 300
  chunk_chars: 7000
  chunk_max_tokens: 2048
  max_retries: 2
  retry_backoff_seconds: 2.0
  output_directory: data/summaries

# services/summary_vector_store.py
summary_store:
  embedding:
    model: BAAI/bge-m3
    device: cpu
    normalize_embeddings: true
  vector_db:
    provider: chroma
    persist_directory: data/vector_db
    summary_collection: paper_summaries
